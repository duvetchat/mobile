name: duvet
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+2

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # The framework's Material and Cupertino localizations, which the app's
  # widgets read: forui's list brings material_ui's and cupertino_ui's.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  forui: 0.27.6
  lucide_icons_flutter: ^4.0.1
  flutter_chat_ui: ^2.12.0
  flutter_chat_core: ^2.9.1
  smooth_sheets: ^1.3.0
  # Its e2e branch, with what the encryption engine needs, until the cutover publishes it as 3.0.0.
  duvet_client:
    git:
      url: https://github.com/duvetchat/client.git
      ref: e2e
  # The end-to-end encryption core's plugin, vendored with its prebuilt libraries (tool/vendor_core.sh): the core's
  # repository is private, and nothing in the app's build compiles Rust.
  duvet_e2e:
    path: packages/duvet_e2e
  # SHA-256: an approval's fingerprint (lib/e2e/conventions.dart).
  crypto: ^3.0.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.4
  # To pick from Android's Photo Picker everywhere (main.dart).
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  just_audio: ^0.10.6
  record: ^7.1.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  gal: ^2.3.3
  path_provider: ^2.1.6
  app_links: ^7.2.2
  # Today for the day separators, which tests can pin with withClock.
  clock: ^1.1.3
  # Voice rooms and calls (M8): WebRTC; the Android foreground service that
  # keeps a call going in the background; and Bluetooth's runtime permission,
  # without which Android 12+ can't route a call to a headset. 12.x, not 13:
  # 13's Android side builds only with AGP 9 (compileSdk 37, built-in Kotlin),
  # and the app is on AGP 8.11.
  flutter_webrtc: ^1.6.2+hotfix.4
  flutter_background: ^1.3.1
  permission_handler: ^12.0.3
  re_highlight: ^0.0.3
  image: ^4.12.0
  youtube_player_iframe: ^6.0.2
  # A playing voice note in Android's media controls (audio_service): needs
  # MainActivity to be an AudioServiceActivity.
  audio_service: ^0.18.19
  # The YouTube dock shows a playing tile's own webview: no reload on the handoff.
  webview_flutter: ^4.14.1
  flex_color_picker: ^4.0.0
  # What loads shows as pulsing bones, as the desktop's skeletons (lib/widgets/skeleton.dart).
  skeletonizer: ^3.0.0
  # Pictures kept on disk between runs (lib/data/images.dart); already here through audio_service.
  flutter_cache_manager: ^3.5.0
  # Push notifications (lib/push): Firebase Cloud Messaging hands the app its
  # installation ID (FID) and the API's data messages, which the app shows as
  # notifications of its own. flutter_local_notifications stays on 22: 23's
  # Android side takes AGP 9.1 and compileSdk 37, and the app is on AGP 8.11.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  # Renews the session every 4 hours while the app sits closed, so a phone left alone keeps getting its pushes
  # (lib/push/renewal.dart).
  workmanager: ^0.10.10
  # A new device's QR, and the phone that scans it to approve that device (PLAN-E2E-CLIENTES.md, Ruling 21; both BSD).
  # mobile_scanner brings the camera's permission into the manifest, asked only as a scan starts.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

# flutter_webrtc 1.6.3 with one audio manager for every Flutter engine of the app (duvetchat/flutter-webrtc, branch
# duvet-1.6.3). The engines that push notifications (firebase_messaging) and the session's background renewal
# (workmanager) start replaced it, and a call they came during lost its output switching, and its release of the
# phone's audio as it ended. Until flutter_webrtc takes the fix.
dependency_overrides:
  flutter_webrtc:
    git:
      url: https://github.com/duvetchat/flutter-webrtc.git
      ref: 71bbcc43694230ded6013158dc00cf68d70a04ee

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  # The tests load the core's Linux library themselves (test/support/core_lib.dart): the plugin's version of it.
  flutter_rust_bridge: 2.13.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/emoji.json
    - assets/mascot/light/
    - assets/mascot/dark/
    - assets/logo/app-icon-rounded.svg
    - assets/logo/app-icon-colored.svg
    - assets/logo/mark-on-light.svg
    # The desktop's .ogg for Android; iOS doesn't decode Vorbis and takes the same sounds as AAC (#228).
    - path: assets/sounds/
      platforms: [android]
    - path: assets/sounds/ios/
      platforms: [ios]

  # The Ghost theme's three faces (lib/theme.dart, DuvetType): Fraunces for
  # the smaller headers and Space names (one variable file, axes set in code),
  # Inter for the interface, page titles and numbers, Roboto for what people
  # write.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Fira Mono
      fonts:
        - asset: assets/fonts/FiraMono-Regular.ttf
    # jdecked/twemoji 17.0.2 as a COLR font, SableClient/twemoji-font v1.0.4's TTF.
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
