# Builds the release APK of a commit and publishes it as a prerelease of this repository, by hand from the Actions
# tab. CI's own APK can't be kept while the organisation's artifact storage is full, and a release's files don't count
# against it. Signed with the release key, as CI's.
name: APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to build
        default: main
        required: true

permissions:
  contents: write

jobs:
  apk:
    # On the organisation's own runner: the 2,000 free Actions minutes a month ran out.
    runs-on: [self-hosted, linux, x64, duvet]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      # As in ci.yml: the release key when the repository has it, the debug key otherwise.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        working-directory: mobile/android
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # A properties file reads \ as an escape: each one doubled stays itself.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${STORE_PASSWORD//\\/\\\\}"
            echo "keyAlias=duvet"
            echo "keyPassword=${KEY_PASSWORD//\\/\\\\}"
          } > key.properties
      - name: Build
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64
      # A prerelease named after the commit, holding the APK and its SHA-256, through the REST API (no gh here).
      - name: Publish
        working-directory: mobile
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          tag="apk-${sha:0:7}"
          apk=build/app/outputs/flutter-apk/app-release.apk
          name="duvet-${tag}.apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          body=$(printf '{"tag_name":"%s","target_commitish":"%s","name":"%s","prerelease":true,"body":"The release APK of %s (arm64-v8a), signed with the release key.\\n\\nSHA-256: %s"}' "$tag" "$sha" "$tag" "$sha" "$sum")
          id=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases" -d "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$apk" "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$name" > /dev/null
          echo "Published $name ($sum) in the release $tag." >> "$GITHUB_STEP_SUMMARY"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" mobile/android/key.properties
