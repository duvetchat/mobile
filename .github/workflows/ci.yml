# Analyze, test and build a release APK on every pull request into dev, as api and desktop do, and into e2e,
# where the end-to-end encryption work waits for its day.
name: CI

on:
  pull_request:
    branches: [dev, e2e]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    # On the organisation's own runner: the 2,000 free Actions minutes a month ran out.
    runs-on: [self-hosted, linux, x64, duvet]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: mobile
      # Gradle's downloads (its distribution, the Android plugin, the dependencies) cached, keyed by the Gradle
      # files: building the APK fetched them all every run. A pull request restores what a run on dev saved.
      # Only on GitHub's runners: the organisation's own keeps ~/.gradle and the Flutter SDK between jobs, and
      # restoring their 2 GB from GitHub's cache there once took 24 minutes (mobile#118).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      # What the failed goldens drew, to look at or to commit as the new ones: they are recorded on Linux,
      # which this runner is.
      - name: Golden failures
        if: failure()
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: golden-failures
          path: mobile/test/failures
          if-no-files-found: ignore
      # Signed with the release key when the repository has it (base64 keystore and its
      # passwords as secrets); with the debug key otherwise, so forks still build.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        working-directory: mobile/android
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # A properties file reads \ as an escape: each one doubled stays itself.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${STORE_PASSWORD//\\/\\\\}"
            echo "keyAlias=duvet"
            echo "keyPassword=${KEY_PASSWORD//\\/\\\\}"
          } > key.properties
      - name: Build
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64
      # Storage is billed in GB-hours: 1-day APKs fit the monthly allowance (372), and once it is
      # used up the upload fails, which shouldn't fail a run whose build and tests passed (#196).
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: duvet-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
